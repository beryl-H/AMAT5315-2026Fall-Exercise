usage = "tnsample --mode gadgets --seed 2026 --out runs/gadgets"
description = "Hard problems as magnets and tensor networks; no unstated defaults"

[args]
seed = "random seed, recorded with the run"
out = "directory for this run's raw evidence"

[args.gadgets]
mode = """
gadgets: with bits x as spins s = 2x - 1, enumerate every state of each gate
energy below. Report the energy of every truth-table row, minimized over the
helper spin w for XOR.
  AND(a,b,z)    s_a s_b - 2 s_a s_z - 2 s_b s_z - s_a - s_b + 2 s_z
  OR(a,b,z)     s_a s_b - 2 s_a s_z - 2 s_b s_z + s_a + s_b - 2 s_z
  NOT(a,z)      s_a s_z
  COPY(a,z)     -s_a s_z
  SET0(z)       s_z
  SET1(z)       -s_z
  XOR(a,b,z,w)  s_a s_b - s_a s_z - 2 s_a s_w - s_b s_z - 2 s_b s_w + 2 s_z s_w
                - s_a - s_b + s_z + 2 s_w
Also enumerate the circuit AND(a,b,t) + NOT(t,out) + SET1(out) and report the
energy of each of its 16 states.
"""

[writes]
stdout = "one tab-separated table with header mode, metric, value, runtime_ms"
"<out>/run.json" = """
Save the schema version, mode, seed, run parameters and summary numbers, with
the full-precision evidence needed to recompute them.
"""

[args.magnet]
l = "side length L of an open square lattice (spins +1/-1); default absent"
p-af = "probability of antiferromagnetic bond J=-1, fixed by L and seed"
beta = "nonnegative inverse temperature for magnet count and sample"
input = "SpinGlass bundle from pred reduce; default absent"
order = "OMECO planner, greedy or treesa (default)"
samples = "positive number of independent sample-mode draws"

[args.plan]
mode = """
Plan with OMECO without contracting. Report variable count and tc (log2
operations) and sc (log2 largest intermediate tensor entries).
"""

[args.count]
mode = """
Report log Z from locally scaled thermal tensors and the exact minimum energy
and multiplicity from min-plus contraction on (energy, count) pairs.
Bundle energies use +sum K_ij s_i s_j + sum h_i s_i. The lattice describes
bonds by J with K = -J.
"""

[args.sample]
mode = """
Store the upward contraction once. Draw the variables eliminated by each node
on the downward pass, weighting each choice by its stored child entries.
Save every bit vector in variable order, and its directly evaluated energy.
"""

[args.nqueens]
n = """
Board size N for plan, count and sample. Each square bit x is shared
by the row, column and two diagonal factors. Each carry tensor T(c_in,
x,c_out) has support (0,0,0), (0,1,1), (1,0,1). All lines start with
carry zero. Rows and columns end at one. Diagonal ends are free.
Count contracts only nonzero entries in row order. Sample follows the
stored row-contraction messages using exact integer completion weights.
Plan estimates the dense carry-network topology with OMECO.
"""
