usage = "uv run --python 3.12 --with jax==0.12.1 python train_branch.py --dataset artifacts/bnb_strong/dataset.json --out artifacts/model.json"

[benchmark.model]
precision = "64-bit JAX on CPU"
input = "training mean and population std over real candidates, std floor 1e-6"
score = "shared 12 -> 48 tanh -> 1 MLP"
probability = "masked softmax over the legal candidates of each node"

[benchmark.training]
split = "check that training and validation share no graph instances"
target = "uniform over scores within 1e-9 * max(1, abs(best)) of the best"
objective = "masked cross-entropy + 2e-4 times squared weights, excluding biases"
optimizer = "Adam, lr 4e-3, batch size 64, 120 epochs, seed 2026"
history = "unpenalized train and validation cross-entropy each epoch"
checkpoint = "minimum validation cross-entropy at epoch 1 or a multiple of 5"
output = "normalization, weights, biases, settings, history and six validation probes"
probes = "real candidate spin IDs, raw features, float64 logits and JAX probabilities"
