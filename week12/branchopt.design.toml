usage = "branchopt --mode gap --spins 22 --edges 52 --count 16 --seed 2026 --out artifacts/gap"
description = "Solve spin-glass integer programs and compare branching rules"

[args]
mode = "gap | bnb | eval"
spins = "number of spins n"
edges = "number of undirected bonds m"
count = "number of instances, IDs 0 through count - 1"
seed = "seed recorded with the run"
out = "raw evidence directory"

[benchmark.gap]
highs = { presolve = false, threads = 1 }
model = """
Minimize sum_e J_e (1 - 2 z_e) + sum_i h_i (1 - 2 x_i).
x_i is binary in MILP and in [0,1] in LP; z_e is continuous in [0,1].
For e=(u,v): z_e <= x_u+x_v, z_e <= 2-x_u-x_v,
z_e >= x_u-x_v, z_e >= x_v-x_u.
"""
square = "Cycle 0-1-2-3-0, J=(+1,+1,+1,-1), h=0. Round ties upward."
diet = "Minimize 6x1 + 3.5x2 with 7x2 >= 8, 4x1+2x2 >= 15, 2x1+x2 >= 3 and x >= 0."
generator = """
SplitMix64 modulo 2^64: state += 0x9E3779B97F4A7C15; z = state;
z = (z ^ (z >> 30)) * 0xBF58476D1CE4E5B9;
z = (z ^ (z >> 27)) * 0x94D049BB133111EB; return z ^ (z >> 31).
Draw integers in 0..k-1 by next() mod k.
Initial instance state is first next() from seed XOR (id * 0xD1B54A32D192ED03).
For each i, draw j until degree(i) >= min(2,n-1), skipping self-loops
and duplicate edges. Then draw pairs i,j until m edges. Sort unique edges (u<v)
lexicographically. In that order draw J=+1 for even next(), -1 otherwise.
Then draw h_i = (next() mod 3) - 1 in spin order.
"""
evidence = "Save graphs, LP/MILP points and energies, gaps, fractional spin counts, and rounded energies and excesses."

[writes]
stdout = "TSV: mode, metric, value, runtime_ms"
"<out>/run.json" = "schema, mode, seed, parameters, summary and raw evidence"

[args.bnb]
policy = "branching rule: most-frac | strong | neural | root-neural"

[benchmark.bnb]
search = """
Depth-first search starts without an incumbent. Prune infeasible LPs and
bounds >= incumbent - 1e-6. Branch only on free spins with
1e-6 < x_i < 1 - 1e-6. Visit the nearer child first, choosing 1 at 0.5.
"""
policies = """
Most-frac picks the candidate closest to 0.5. Strong scores each candidate
by max(d0,1e-6)*max(d1,1e-6) using both child LPs. Use gain 1e6 if a child
is pruned or infeasible. Count the trial solves, leave the incumbent unchanged,
and break ties by lowest spin index.
"""
evidence = "Save the tetrahedron trace, ground energies, HiGHS errors, nodes, LP solves and time."


[args.labels]
export-labels = "save Strong Branching labels in bnb mode, off by default"

[benchmark.bnb.features]
labels = """
Save at most 80 nodes per instance with two or more legal candidates.
IDs 0–35 train, IDs 36–47 validate. Save both gains, their product score,
and the number of children that were pruned or infeasible. Clamp x to [0,1],
use s=1-2x, d=incident bond count, and scale by max(1e-9, max row |dual|).
Features in order: x, 2 min(x,1-x), h, |h|, d/max(1,max degree),
(positive bonds - negative bonds)/max(1,d), (h+sum J*s_neighbor)/(d+1)
and its absolute value, mean local sum of four absolute row duals per bond
divided by the dual scale, mean |z - 0.5*(1-s_i*s_neighbor)|,
mean neighbor fractionality (fixed neighbor contributes 0),
and clamp((incumbent-bound)/max(|incumbent|,1),0,2), or 1 if no incumbent.
"""
[writes.labels]
"<out>/dataset.json" = "full precision features, gains, and train/validation nodes"

[args.eval]
model = "JAX model.json with training normalization and six probes"

[benchmark.eval]
policies = """
Compare Rust logits and probabilities on all six JAX probes. Compare most-frac,
strong and neural, which selects the legal candidate with highest MLP score.
Record HiGHS error, nodes, LP solves and measured search wall time, and the first
two branch spins and timings on the largest paired neural node saving.
"""
