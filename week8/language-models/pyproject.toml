[project]
name = "amat5315-week8-language-models"
version = "0.1.0"
description = "AMAT5315 Week 8 (revised 24-page sheet): six-part language-model worksheet"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.6",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "matplotlib==3.10.3",
  "pytest==8.4.2",
  "sentencepiece==0.2.2",
  "safetensors==0.8.0",
  "scipy==1.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
