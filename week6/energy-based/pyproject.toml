[project]
name = "ebm-week6"
version = "0.1.0"
description = "AMAT5315 Week 6: Energy-based models (Part 1: dataset understanding)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jax[cpu]>=0.4.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
