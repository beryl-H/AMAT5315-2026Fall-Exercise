[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amat5315-week6"
version = "0.2.0"
description = "Diffusion models exercise (Part 1 mixture score; Part 2 MNIST diffusion CLI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "pytest==9.1.1",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.11.2"]

[project.scripts]
diffusion = "diffusion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion"]

[tool.pytest.ini_options]
testpaths = ["."]
