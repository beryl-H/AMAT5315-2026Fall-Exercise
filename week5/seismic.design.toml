usage = """
seismic --experiment inputs/reflector.json --mode forward --out \
artifacts/forward"""
description = """
propagate acoustic waves and their derivatives; no unstated defaults"""

[args]
experiment = """
JSON physical model and survey in reduced units, with these fields:
name: experiment identifier; nx, nz: grid points along x and depth z;
dx: grid spacing; dt: timestep; steps: number of time steps;
source_frequency: peak frequency f0 of the Ricker pulse;
source_peak_time: time t0 of its peak; source_amplitude: source strength;
shots: source positions, one [x,z] grid index per shot;
receivers: receiver positions as [x,z] grid indices;
sponge_width: width in cells; sponge_strength: largest damping at the edge;
background: wave speed c as a [z][x] array;
perturbation: velocity perturbation as a [z][x] array, born mode's input;
length_unit_m: metres per length unit; time_unit_s: seconds per time unit.
"""
mode = "forward: pressure traces; born: tangent traces; adjoint: migrated image"
out = "output folder"

[writes]
stdout = "a header, then one tab-separated line per shot: shot, mode, l2 (L2 norm)"
"<out>/run.json" = """
experiment: fields named by the experiment argument,
except background and perturbation;
optional input schema and provenance are copied; no model or initial-state arrays.
experiment_file: input path; experiment_sha256: SHA-256 of the input file bytes;
arguments: invocation flags;
precision: float64; parameter: velocity; inner_product: unweighted Euclidean sums
"""
"<out>/result.json" = """
schema: week5-born-rtm-v2; experiment: input name (string);
mode, nx, nz, steps, dt, dx, shots, receivers, implementation, seconds;
statistics: null except for adjoint counters
"""
"<out>/traces.npy" = "forward: float64 [shot, step, receiver] pressures"
"<out>/born_data.npy" = "born: float64 [shot, step, receiver] scattered data"
"<out>/image.npy" = "adjoint: float64 [z, x] velocity sensitivity"

[args.recording]
every = "steps between recorded forward or adjoint pressure fields; default off"

[writes.recording]
"<out>/wavefield.npy" = """
float32 [frame, z, x] pressure of the first shot; forward frames in increasing
steps, adjoint frames in decreasing steps. An adjoint frame is the
current-pressure adjoint after reversing its step; outer boundary values are zero.
"""
"<out>/run.json" = """
also contains recording: every (integer stride), steps (integer array),
times (array of reduced times, step*dt); arrays follow wavefield frame order
"""

[args.reverse]
data = "born_data.npy of a born run: float64 [shot, step, receiver] receiver weights to back-propagate"
[writes.reverse]
"<out>/result.json" = """
adjoint adds statistics: storage=full, checkpoints=null, state_wavefields=2;
saved_state_bytes: 2*nx*nz*8; peak_saved_states: N+1 for N timesteps;
peak_saved_bytes: peak_saved_states*saved_state_bytes;
scheduler_forward_calls: forward steps run by the schedule, excluding VJP work;
reverse_calls: timestep VJPs.
per_shot: array in shot order, each with scheduler_forward_calls, reverse_calls,
peak_saved_states. Sum work across shots; take maxima for peaks.
Saved-state bytes exclude work buffers, adjoints, model, data and AD scratch.
"""
[args.checkpoint]
storage = "adjoint storage: full (default, every complete state) or treeverse"
checkpoints = "extra saved-state slots beyond the initial state; for treeverse"
[writes.checkpoint]
"<out>/actions-<shot>.json" = """
per-shot array: action, step, saved_states (live slots after the action).
Initial state 0 occupies a permanent slot without a store event.
restore: copy saved state step to the replay workspace.
call: advance workspace from step to step+1 (step is the INPUT index).
store: save the current workspace at step in a new slot.
grad: reverse step using its input state from a SAVED slot, not workspace.
fetch: discard saved state step; never discard state 0.
grad steps are N-1,...,0 exactly once; finish with only state 0 saved.
"""
"<out>/result.json" = """
statistics uses reverse counters; storage=treeverse; checkpoints=requested budget.
per_shot also names actions_file (relative filename); full history needs no log.
"""
