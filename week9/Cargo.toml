[package]
name = "infer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omeco = "=0.2.6"
rand = { version = "0.9", features = ["small_rng"] }
tenferro-tensor = "=0.9.0"
tenferro-cpu = { version = "=0.9.0", default-features = false, features = ["native"] }
tenferro-einsum = { version = "=0.9.0", default-features = false }
